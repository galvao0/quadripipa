<div class="content">
  <div class="logo">
    <img
      src="https://www.quadripipa.com.br/assets/logo-Cynmk3UE.webp"
      alt="Quadripipa"
      width="100"
      height="100"
    />
  </div>

  <div class="body">
    <div class="header">
      <h1>Verifique sua conta</h1>
      <p>
        Acesse sua caixa de entrada e informe o código de verificação que enviamos para seu e-mail.
      </p>
    </div>

    <div class="div-input-code">
      <div class="input-code">
        <input
          *ngFor="let numero of numCode; let i = index"
          type="number"
          maxlength="1"
          inputmode="numeric"
          [value]="numCode[i]"
          (input)="onInput($event, i)"
        />
      </div>

      <div class="info">
        <svg lucideInfo></svg>
        <p>O código expira em 45 minutos.</p>
      </div>
    </div>

    <div class="div-btn">
      <div *ngIf="hideError" class="div-error">
        <svg lucideCircleX></svg>
        <p>{{ error }}</p>
      </div>
      <button class="btn-primary" (click)="verifyEmail()">Verificar código</button>

      <button class="btn-secundary">Solicitar novo código</button>
    </div>
  </div>
</div>
